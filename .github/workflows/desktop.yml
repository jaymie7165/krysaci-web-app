name: Build desktop app

# Po vytvoření tagu desktop-v1.0.0 (nebo ručním spuštění) sestaví PlayHaven.exe a přiloží ho k Release.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/dist/PlayHaven.exe
            desktop/dist/PlayHaven-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PlayHaven
          path: |
            desktop/dist/PlayHaven.exe
            desktop/dist/PlayHaven-Setup.exe
