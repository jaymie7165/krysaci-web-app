<!doctype html><html><head><meta charset="utf-8"><title>Play Haven</title><style>
html,body{margin:0;height:100%;background:#0c070e;color:#ece9f8;font-family:Segoe UI,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.pet{animation:hop 1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.96,1.06)}55%{transform:translateY(0) scale(1.07,.93)}}
.shadow{animation:sh 1s ease-in-out infinite;transform-origin:center}
@keyframes sh{0%,100%{transform:scaleX(1);opacity:.35}30%{transform:scaleX(.7);opacity:.2}}
.bar{width:180px;height:4px;background:#2a1f33;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#d9467f;border-radius:4px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
p{margin:0;color:#9b8fb0;font-size:13px;letter-spacing:.04em}
</style></head><body>
<div style="position:relative;width:140px;height:170px"><div class="shadow" style="position:absolute;bottom:0;left:50%;margin-left:-46px;width:92px;height:14px;border-radius:50%;background:#000"></div><img class="pet" src="pets/dragon-2.webp" style="position:absolute;bottom:6px;left:50%;height:150px;margin-left:-50px" alt=""></div>
<div class="bar"><i></i></div><p>Načítám Play Haven…</p></body></html>
